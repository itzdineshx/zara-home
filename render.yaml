services:
  - type: web
    name: zara-backend
    env: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements-render.txt
    startCommand: gunicorn -c gunicorn_conf.py app.main:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: WEB_CONCURRENCY
        value: 1
      - key: TTS_ENABLED
        value: false
      - key: HOME_AUTOMATION_DEFAULT
        value: false
      - key: HOME_MQTT_ENABLED
        value: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: HOME_MQTT_HOST
        sync: false
      - key: HOME_MQTT_PORT
        sync: false
      - key: HOME_MQTT_USERNAME
        sync: false
      - key: HOME_MQTT_PASSWORD
        sync: false
      - key: HOME_MQTT_TLS_ENABLED
        value: true
      - key: HOME_MQTT_TLS_INSECURE
        value: false

  - type: cron
    name: zara-backend-keepalive
    env: python
    rootDir: backend
    schedule: "*/10 * * * *"
    buildCommand: pip install --upgrade pip && pip install -r requirements-render.txt
    command: python -c "import os, sys, urllib.request; base_url = os.getenv('BACKEND_KEEPALIVE_URL') or os.getenv('RENDER_EXTERNAL_URL');\nif not base_url:\n    sys.exit(0)\nurl = base_url.rstrip('/') + '/health'; urllib.request.urlopen(url, timeout=5).read()"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: BACKEND_KEEPALIVE_URL
        sync: false
